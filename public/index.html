<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17262f">
  <title>Field Issue Tracker</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Field Issue Tracker</h1>
      <span id="conn" class="conn" role="status">Checking…</span>
    </div>
    <div class="controls">
      <label>Role
        <select id="role"><option value="worker">Field worker</option><option value="coordinator">Coordinator</option></select>
      </label>
      <label>Name <input id="actor" maxlength="40" autocomplete="off"></label>
      <button id="syncBtn" type="button" class="btn">Sync now <span id="pendingCount" class="count" hidden>0</span></button>
      <label class="check" title="For demos and QA: makes every request fail as if the network were down"><input type="checkbox" id="simOffline"> Simulate offline</label>
    </div>
  </header>

  <main>
    <section class="toolbar">
      <button id="newBtn" type="button" class="btn primary">New report</button>
      <label>Show
        <select id="filter">
          <option value="all">All reports</option>
          <option value="unsynced">Not yet synced</option>
          <option value="failed">Sync failed</option>
          <option value="Draft">Drafts</option>
          <option value="Submitted">Submitted</option>
          <option value="Assigned">Assigned</option>
          <option value="In Progress">In Progress</option>
          <option value="Resolved">Resolved</option>
          <option value="Rejected">Rejected</option>
        </select>
      </label>
      <span id="summary" class="summary"></span>
    </section>
    <ul id="list" class="list" aria-live="polite"></ul>
    <p id="empty" class="empty" hidden>No reports match this view.</p>
  </main>

  <dialog id="formDlg">
    <form id="form" method="dialog" novalidate>
      <h2>New report</h2>
      <label>Category <select name="category" required></select></label>
      <label>Description <textarea name="description" rows="4" maxlength="2000" required placeholder="What is wrong, and what does it affect?"></textarea></label>
      <label>Location <input name="location" maxlength="200" required placeholder="Village, landmark or GPS"></label>
      <label>Priority <select name="priority" required></select></label>
      <p class="hint">The date and time are recorded automatically when you save. Reports save on this device first and sync when you are online.</p>
      <p id="formErr" class="err" role="alert" hidden></p>
      <div class="row">
        <button type="button" class="btn" data-act="cancel">Cancel</button>
        <button type="button" class="btn" data-act="draft">Save as draft</button>
        <button type="submit" class="btn primary" data-act="submit">Save &amp; submit</button>
      </div>
    </form>
  </dialog>

  <dialog id="detailDlg"><div id="detail"></div></dialog>
  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
